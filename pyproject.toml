[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to access Garmin data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.0.1",
    "garminconnect==0.3.16",
    "requests>=2.33.0",
    "mcp==1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"

[tool.uv.sources]
garmin-mcp = { workspace = true }
